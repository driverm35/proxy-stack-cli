name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build assets
        run: bash scripts/package-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "proxystack ${tag}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/proxystack.sh \
            "dist/proxy-stack-cli-${tag}.tar.gz" \
            dist/SHA256SUMS
