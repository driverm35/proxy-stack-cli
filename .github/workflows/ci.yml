name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint and unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck, shfmt, and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats
          curl -sSLo /tmp/shfmt "https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64"
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - name: shellcheck, shfmt, unit tests
        run: make check

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install proxy packages and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y dante-server squid apache2-utils curl ca-certificates gnupg python3 iproute2
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y caddy
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
      - name: Validate configs and exercise listeners
        run: sudo bats tests/integration
